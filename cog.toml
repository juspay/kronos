from_latest_tag = true
ignore_merge_commits = true
branch_whitelist = ["main"]

tag_prefix = "v"

pre_bump_hooks = [
    "cargo set-version --workspace {{version}}",
    "cargo set-version --manifest-path crates/client/Cargo.toml --offline {{version}}",
    "cargo update --workspace --offline",
]

post_bump_hooks = []

[commit_types]

[changelog]
path = "CHANGELOG.md"
authors = []
